# Place this file at: .github/workflows/deploy.yml
name: Deploy to S3

on:
  push:
    branches:
      - dashboard   # original
      # - react    # deploy on pushes to the react branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Pins Node for this Vite 8 / React 19 / TS 6 stack. Your pasted file
      # used the runner's default Node; remove this step if you'd rather keep
      # parity with your other workflows.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build App
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1   # change to your bucket's region

      # PWA caching, in two passes:
      #  - /assets/* are content-hashed -> immutable, cached 1 year, and NOT
      #    pruned immediately so clients still on the old index.html keep loading.
      #  - everything else (index.html, sw.js, manifest, icons) must revalidate;
      #    --delete here prunes files removed from the build.
      - name: Deploy to S3 — hashed assets (immutable)
        run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" \
            --include "assets/*"

      - name: Deploy to S3 — app shell (no-cache) + prune
        run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --cache-control "no-cache" \
            --exclude "assets/*" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
